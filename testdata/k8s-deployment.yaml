apiVersion: apps/v1
kind: Deployment
metadata:
    labels:
        app: goku
    name: goku-app
spec:
    replicas: 2
    selector:
        matchLabels:
            app: goku
    template:
        metadata:
            labels:
                app: goku
        spec:
            containers:
                - env:
                    - name: LOG_LEVEL
                      value: info
                  image: goku:1.0.0
                  name: goku
                  ports:
                    - containerPort: 8080
                  resources:
                    limits:
                        cpu: 500m
                        memory: 256Mi
                    requests:
                        cpu: 100m
                        memory: 128Mi
